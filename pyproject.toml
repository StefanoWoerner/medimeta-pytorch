[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medimeta"
version = "0.0.7"
authors = [
    { name = "Stefano Woerner", email = "stefano@woerner.eu" },
]
description = "Library for using the MedIMeta dataset"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "h5py>=3.12.1",
    "numpy>=2.1.3",
    "torch>=2.6.0",
    "PyYAML>=6.0.2",
    "Pillow>=11.1.0",
    "torchvision>=0.21.0",
    "torchcross>=0.0.7",
]

[project.urls]
"Homepage" = "https://github.com/StefanoWoerner/medimeta-pytorch"
"Issue Tracker" = "https://github.com/StefanoWoerner/medimeta-pytorch/issues"

[tool.hatch.build.targets.wheel]
packages = ["medimeta"]
